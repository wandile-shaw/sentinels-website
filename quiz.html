<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SENTINELS</title><link rel="stylesheet" href="style.css"></head>
<body data-page="quiz"><main class="wrap">
<h2 class="sec" style="margin-top:50px">QUIZ</h2><p class="sub">How well do you know the Sentinels?</p>

<div class="panel" id="qs"><h2>ENTER THE TEST</h2><p>Ten questions. One score. Retry as often as you like.</p><button class="btn sm" id="go">BEGIN TEST</button></div>

<div class="panel" id="qg" hidden>
 <div class="top2"><span id="qn"></span><span id="sc"></span></div><div class="prog"><i id="pr"></i></div>
 <h2 id="qt" style="letter-spacing:.04em;font-size:1.3rem"></h2><div class="answers" id="an"></div><p class="fb" id="fb"></p>
</div>

<div class="panel" id="qr" hidden>
 <p style="margin:0;letter-spacing:.2em">TEST COMPLETE</p><div class="score"><span id="fs"></span> / 10</div>
 <h2 id="rt"></h2><p id="rd"></p>
 <button class="btn sm" id="again">TRY AGAIN</button><a class="btn sm" href="prediction.html" style="text-decoration:none">MAKE A PREDICTION</a>
</div>
</main>
<script src="script.js"></script>
<script>
/* ===== QUIZ QUESTIONS - edit here. "c" = number of the correct answer, starting at 0 ===== */
const Q=[
 {q:"How many members make up the main Sentinel team?",a:["Two","Three","Four","Five"],c:2},
 {q:"Which colour identifies Wandile's Sentinel?",a:["Red","Blue","Green","Pink"],c:1},
 {q:"What is Kyla's primary ability?",a:["Strength","Flight","Speed","Energy blasts"],c:2},
 {q:"What is Xavier primarily known for?",a:["Strength and power","Flight and speed","Healing","Energy shields"],c:0},
 {q:"How does Cee achieve flight?",a:["Energy propulsion","Retractable wings","Teleportation","She cannot fly"],c:1},
 {q:"Where does Cee project her energy blasts from?",a:["Her eyes","Her wings","Her hands","Her chest"],c:2},
 {q:"Who are the two wise aliens connected to the Sentinels?",a:["Vaelor and Zyron","Vorax and Vaelor","Zyron and Vorax","Kyla and Vaelor"],c:0},
 {q:"Who wants the Sentinels?",a:["Vaelor","Zyron","Vorax","Xavier"],c:2},
 {q:"Which Sentinel develops speed and flight in addition to his strength?",a:["Xavier","Wandile","Cee","Kyla"],c:1},
 {q:"Which combination correctly describes Cee?",a:["Speed, agility and rapid movement","Strength, power and close combat","Flight, retractable wings and hand energy blasts","Strength, speed and energy shields"],c:2}
];
const RANKS=[[10,"SENTINEL","Perfect score. You know the Sentinels inside and out."],[8,"FIELD OPERATIVE","You know the story well. Only a few details escaped you."],[6,"RECRUIT","You have the basics. Time to study the archive a little closer."],[4,"OBSERVER","You've seen the story, but you haven't been paying enough attention."],[0,"UNKNOWN","The archive barely recognises you. Back to the files."]];
const $=id=>document.getElementById(id);let i=0,s=0,lock=false;
const show=n=>{["qs","qg","qr"].forEach(x=>$(x).hidden=x!==n)};
function load(){lock=false;const q=Q[i];$("qn").textContent="QUESTION "+(i+1)+" / "+Q.length;$("sc").textContent="SCORE "+s;
 $("pr").style.width=((i+1)/Q.length*100)+"%";$("qt").textContent=q.q;$("fb").textContent="";$("an").innerHTML="";
 q.a.forEach((t,k)=>{const b=document.createElement("button");b.className="ans";b.textContent=t;b.onclick=()=>pick(k,b);$("an").appendChild(b)})}
function pick(k,b){if(lock)return;lock=true;const q=Q[i];
 [...$("an").children].forEach((x,n)=>{x.disabled=true;if(n===q.c)x.classList.add("ok")});
 if(k===q.c){s++;$("fb").textContent="CORRECT"}else{b.classList.add("no");$("fb").textContent="INCORRECT"}
 $("sc").textContent="SCORE "+s;
 setTimeout(()=>{i++;if(i>=Q.length){const r=RANKS.find(x=>s>=x[0]);$("fs").textContent=s;$("rt").textContent=r[1];$("rd").textContent=r[2];show("qr")}else load()},850)}
$("go").onclick=()=>{i=0;s=0;show("qg");load()};$("again").onclick=()=>show("qs");
</script></body></html>
