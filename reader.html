<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sentinels — Reader</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            background: #030407;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

        }


        /* TOP BAR */

        .reader-bar {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 65px;

            z-index: 100;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 25px;

            background:
                rgba(3,4,7,0.9);

            backdrop-filter:
                blur(15px);

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);

        }


        .reader-logo {

            font-size: 18px;

            font-weight: 900;

            letter-spacing: 3px;

        }


        .reader-info {

            font-size: 11px;

            letter-spacing: 2px;

            opacity: 0.55;

        }


        .reader-controls {

            display: flex;

            gap: 10px;

        }


        .control {

            border:
                1px solid
                rgba(255,255,255,0.15);

            background: transparent;

            color: white;

            padding: 9px 13px;

            cursor: pointer;

            font-size: 11px;

            transition: 0.25s ease;

        }


        .control:hover {

            border-color:
                rgba(255,255,255,0.5);

        }


        /* READER */

        .reader {

            min-height: 100vh;

            padding:
                100px 20px 120px;

            display: flex;

            flex-direction: column;

            align-items: center;

        }


        .page {

            width: min(
                900px,
                100%
            );

            min-height: 800px;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background: #0a0c12;

        }


        .placeholder {

            text-align: center;

            padding: 40px;

        }


        .placeholder-number {

            font-size: 12px;

            letter-spacing: 5px;

            opacity: 0.4;

            margin-bottom: 20px;

        }


        .placeholder h1 {

            font-size:
                clamp(
                    45px,
                    8vw,
                    90px
                );

            letter-spacing: 4px;

            margin-bottom: 20px;

        }


        .placeholder p {

            max-width: 450px;

            line-height: 1.7;

            color:
                rgba(255,255,255,0.45);

        }


        /* NAVIGATION */

        .page-navigation {

            width: min(
                900px,
                100%
            );

            margin-top: 25px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

        }


        .nav-button {

            border:
                1px solid
                rgba(255,255,255,0.18);

            background: transparent;

            color: white;

            padding:
                14px 22px;

            cursor: pointer;

            letter-spacing: 2px;

            font-size: 11px;

            transition: 0.25s ease;

        }


        .nav-button:hover {

            border-color: white;

        }


        .page-count {

            font-size: 11px;

            letter-spacing: 3px;

            opacity: 0.45;

        }


        /* MOBILE */

        @media (max-width: 700px) {

            .reader-bar {

                padding: 0 12px;

            }

            .reader-info {

                display: none;

            }

            .control {

                padding:
                    8px 9px;

            }

            .reader {

                padding:
                    85px 10px 100px;

            }

            .page {

                min-height: 600px;

            }

            .page-navigation {

                gap: 10px;

            }

            .nav-button {

                padding:
                    12px 14px;

            }

        }

    </style>

</head>


<body>


    <!-- TOP BAR -->

    <header class="reader-bar">

        <a
            href="archive.html"
            class="reader-logo"
        >
            SENTINELS
        </a>


        <div
            class="reader-info"
            id="volumeTitle"
        >
            VOLUME 1
        </div>


        <div
            class="reader-controls"
        >

            <button
                class="control"
                onclick="toggleFullscreen()"
            >
                ⛶
            </button>

            <button
                class="control"
                onclick="goArchive()"
            >
                ☰
            </button>

        </div>

    </header>


    <!-- READER -->

    <main class="reader">


        <div
            class="page"
            id="comicPage"
        >

            <div class="placeholder">

                <div
                    class="placeholder-number"
                    id="pageLabel"
                >
                    PAGE 01
                </div>

                <h1>
                    SENTINELS
                </h1>

                <p>
                    Your finished comic pages will
                    appear here.

                    This reader is already prepared
                    for the final artwork.
                </p>

            </div>

        </div>


        <!-- PAGE NAVIGATION -->

        <div
            class="page-navigation"
        >

            <button
                class="nav-button"
                onclick="previousPage()"
            >
                ← PREVIOUS
            </button>


            <div
                class="page-count"
                id="pageCount"
            >
                PAGE 1
            </div>


            <button
                class="nav-button"
                onclick="nextPage()"
            >
                NEXT →
            </button>

        </div>


    </main>


    <script>

        /* GET VOLUME FROM URL */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const volume =
            params.get("volume") || "1";


        /* PAGE SYSTEM */

        let currentPage = 1;

        const totalPages = 23;


        const volumeTitle =
            document.getElementById(
                "volumeTitle"
            );

        const pageLabel =
            document.getElementById(
                "pageLabel"
            );

        const pageCount =
            document.getElementById(
                "pageCount"
            );


        if (volume === "2") {

            volumeTitle.textContent =
                "VOLUME 2";

        } else {

            volumeTitle.textContent =
                "VOLUME 1";

        }


        function updatePage() {

            const number =
                String(currentPage)
                .padStart(2, "0");


            pageLabel.textContent =
                "PAGE " + number;


            pageCount.textContent =
                "PAGE " +
                currentPage +
                " / " +
                totalPages;

        }


        function nextPage() {

            if (
                currentPage <
                totalPages
            ) {

                currentPage++;

                updatePage();

            }

        }


        function previousPage() {

            if (
                currentPage >
                1
            ) {

                currentPage--;

                updatePage();

            }

        }


        function goArchive() {

            window.location.href =
                "archive.html";

        }


        function toggleFullscreen() {

            if (
                !document.fullscreenElement
            ) {

                document.documentElement
                    .requestFullscreen();

            } else {

                document.exitFullscreen();

            }

        }


        updatePage();

    </script>


</body>

</html>
