<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinels — Reader</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #030407;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        /* TOP BAR */

        .reader-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            background: rgba(3, 4, 7, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .reader-logo {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .reader-info {
            font-size: 11px;
            letter-spacing: 2px;
            opacity: 0.55;
        }

        .reader-controls {
            display: flex;
            gap: 10px;
        }

        .control {
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: transparent;
            color: white;
            padding: 9px 13px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.25s ease;
        }

        .control:hover {
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* READER */

        .reader {
            min-height: 100vh;
            padding: 90px 15px 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page {
            width: min(900px, 100%);
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #0a0c12;
            overflow: hidden;
        }

        .comic-image {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .comic-image[hidden] {
            display: none;
        }

        .message {
            text-align: center;
            padding: 40px 25px;
        }

        .message-label {
            font-size: 12px;
            letter-spacing: 5px;
            opacity: 0.4;
            margin-bottom: 20px;
        }

        .message h1 {
            font-size: clamp(35px, 8vw, 75px);
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        .message p {
            max-width: 450px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.55);
        }

        .error-message {
            display: none;
            text-align: center;
            padding: 35px 25px;
            max-width: 550px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.7);
        }

        .error-message h2 {
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .error-message p {
            overflow-wrap: anywhere;
        }

        /* NAVIGATION */

        .page-navigation {
            width: min(900px, 100%);
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .nav-button {
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: transparent;
            color: white;
            padding: 14px 22px;
            cursor: pointer;
            letter-spacing: 2px;
            font-size: 11px;
            transition: 0.25s ease;
        }

        .nav-button:hover:not(:disabled) {
            border-color: white;
        }

        .nav-button:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .page-count {
            font-size: 11px;
            letter-spacing: 3px;
            opacity: 0.55;
            text-align: center;
        }

        /* MOBILE */

        @media (max-width: 700px) {
            .reader-bar {
                padding: 0 12px;
                height: 58px;
            }

            .reader-logo {
                font-size: 15px;
                letter-spacing: 2px;
            }

            .reader-info {
                display: none;
            }

            .control {
                padding: 8px 10px;
            }

            .reader {
                padding: 75px 8px 35px;
            }

            .page {
                min-height: 200px;
            }

            .comic-image {
                max-height: none;
            }

            .page-navigation {
                gap: 6px;
                margin-top: 15px;
            }

            .nav-button {
                padding: 12px 10px;
                font-size: 10px;
                letter-spacing: 1px;
            }

            .page-count {
                font-size: 10px;
                letter-spacing: 1px;
            }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->

    <header class="reader-bar">
        <a href="archive.html" class="reader-logo">
            SENTINELS
        </a>

        <div class="reader-info" id="volumeTitle">
            VOLUME 1
        </div>

        <div class="reader-controls">
            <button
                class="control"
                id="fullscreenButton"
                onclick="toggleFullscreen()"
                aria-label="Toggle fullscreen"
                title="Toggle fullscreen"
            >
                ⛶
            </button>

            <button
                class="control"
                onclick="goArchive()"
                aria-label="Back to archive"
                title="Back to archive"
            >
                ☰
            </button>
        </div>
    </header>

    <!-- COMIC READER -->

    <main class="reader">

        <div class="page" id="comicPage">

            <img
                id="comicImage"
                class="comic-image"
                alt="Sentinels comic page 1"
                hidden
            >

            <div class="message" id="volumeMessage" hidden>
                <div class="message-label">
                    SENTINELS
                </div>

                <h1>COMING SOON</h1>

                <p>
                    This volume is not available to read yet.
                </p>
            </div>

            <div class="error-message" id="errorMessage">
                <div class="message-label" id="errorPageLabel">
                    PAGE 01
                </div>

                <h2>PAGE NOT FOUND</h2>

                <p>
                    This page image could not be loaded.
                    The reader checked the expected filenames
                    inside the volume1 folder.
                </p>
            </div>

        </div>

        <!-- PAGE NAVIGATION -->

        <div class="page-navigation">

            <button
                class="nav-button"
                id="previousButton"
                onclick="previousPage()"
            >
                ← PREVIOUS
            </button>

            <div class="page-count" id="pageCount">
                PAGE 1 / 25
            </div>

            <button
                class="nav-button"
                id="nextButton"
                onclick="nextPage()"
            >
                NEXT →
            </button>

        </div>

    </main>

    <script>
        /* GET VOLUME FROM URL */

        const params = new URLSearchParams(
            window.location.search
        );

        const volume = params.get("volume") || "1";

        /* VOLUME 1 SETTINGS */

        const totalPages = 25;
        let currentPage = 1;
        let currentFileIndex = 0;

        /*
          The reader will try these name patterns in order.
          This supports names like:
          Page-01.jpeg
          page-01.jpeg
          page01.jpg
          page01.png
        */

        const volumeFolder = "volume1";

        const volumeTitle = document.getElementById(
            "volumeTitle"
        );

        const comicImage = document.getElementById(
            "comicImage"
        );

        const volumeMessage = document.getElementById(
            "volumeMessage"
        );

        const errorMessage = document.getElementById(
            "errorMessage"
        );

        const errorPageLabel = document.getElementById(
            "errorPageLabel"
        );

        const pageCount = document.getElementById(
            "pageCount"
        );

        const previousButton = document.getElementById(
            "previousButton"
        );

        const nextButton = document.getElementById(
            "nextButton"
        );

        volumeTitle.textContent = "VOLUME " + volume;

        /* MAKE POSSIBLE FILE NAMES FOR A PAGE */

        function getPossibleFilenames(pageNumber) {
            const number = String(pageNumber).padStart(2, "0");

            return [
                "Page-" + number + ".jpeg",
                "Page-" + number + ".jpg",
                "Page-" + number + ".png",

                "page-" + number + ".jpeg",
                "page-" + number + ".jpg",
                "page-" + number + ".png",

                "Page" + number + ".jpeg",
                "Page" + number + ".jpg",
                "Page" + number + ".png",

                "page" + number + ".jpeg",
                "page" + number + ".jpg",
                "page" + number + ".png"
            ];
        }

        /* UPDATE DISPLAYED PAGE */

        function updatePage() {
            const number = String(currentPage).padStart(2, "0");

            pageCount.textContent =
                "PAGE " + currentPage + " / " + totalPages;

            previousButton.disabled = currentPage === 1;
            nextButton.disabled = currentPage === totalPages;

            comicImage.hidden = true;
            errorMessage.style.display = "none";
            volumeMessage.hidden = true;

            if (volume !== "1") {
                volumeMessage.hidden = false;
                return;
            }

            comicImage.alt =
                "Sentinels comic page " + currentPage;

            currentFileIndex = 0;
            tryNextFilename(number);
        }

        /* TRY EACH SUPPORTED FILE NAME */

        function tryNextFilename(number) {
            const filenames = getPossibleFilenames(currentPage);

            if (currentFileIndex >= filenames.length) {
                comicImage.hidden = true;

                errorPageLabel.textContent =
                    "PAGE " + number;

                errorMessage.style.display = "block";
                return;
            }

            const filename = filenames[currentFileIndex];

            comicImage.src =
                volumeFolder + "/" + filename;
        }

        /* IMAGE LOAD EVENTS */

        comicImage.onload = function () {
            comicImage.hidden = false;
            errorMessage.style.display = "none";
        };

        comicImage.onerror = function () {
            currentFileIndex++;
            tryNextFilename(
                String(currentPage).padStart(2, "0")
            );
        };

        /* NEXT / PREVIOUS */

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                updatePage();
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            }
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                updatePage();
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            }
        }

        /* BACK TO ARCHIVE */

        function goArchive() {
            window.location.href = "archive.html";
        }

        /* FULLSCREEN */

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement
                        .requestFullscreen()
                        .catch(function () {});
                }
            } else if (document.exitFullscreen) {
                document.exitFullscreen()
                    .catch(function () {});
            }
        }

        /* KEYBOARD PAGE CONTROLS */

        document.addEventListener("keydown", function (event) {
            if (event.key === "ArrowRight") {
                nextPage();
            }

            if (event.key === "ArrowLeft") {
                previousPage();
            }
        });

        /* LOAD FIRST PAGE */

        updatePage();
    </script>

</body>
</html>
