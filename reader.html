<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030407">
    <title>Sentinels — Reader</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            background: #030407;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        /* TOP BAR */

        .reader-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            background: rgba(3, 4, 7, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .reader-logo {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .reader-info {
            font-size: 11px;
            letter-spacing: 2px;
            opacity: 0.55;
        }

        .reader-controls {
            display: flex;
            gap: 10px;
        }

        .control {
            min-width: 38px;
            min-height: 36px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: transparent;
            color: white;
            padding: 8px 11px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .control:hover {
            border-color: rgba(255, 255, 255, 0.65);
            background: rgba(255, 255, 255, 0.06);
        }

        /* READER AREA */

        .reader {
            min-height: 100vh;
            min-height: 100dvh;
            padding: 90px 15px 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page {
            width: min(900px, 100%);
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #0a0c12;
            overflow: hidden;
        }

        .comic-image {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .comic-image[hidden] {
            display: none;
        }

        .message {
            text-align: center;
            padding: 40px 25px;
        }

        .message-label {
            font-size: 12px;
            letter-spacing: 5px;
            opacity: 0.4;
            margin-bottom: 20px;
        }

        .message h1 {
            font-size: clamp(35px, 8vw, 75px);
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        .message p {
            max-width: 450px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.55);
        }

        .error-message {
            display: none;
            max-width: 550px;
            padding: 35px 25px;
            text-align: center;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.7);
        }

        .error-message h2 {
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .error-message p {
            overflow-wrap: anywhere;
        }

        /* PAGE NAVIGATION */

        .page-navigation {
            width: min(900px, 100%);
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .nav-button {
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: transparent;
            color: white;
            padding: 14px 22px;
            cursor: pointer;
            letter-spacing: 2px;
            font-size: 11px;
            transition: border-color 0.2s ease;
        }

        .nav-button:hover:not(:disabled) {
            border-color: white;
        }

        .nav-button:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .page-count {
            font-size: 11px;
            letter-spacing: 3px;
            opacity: 0.55;
            text-align: center;
        }

        /* PHONE-FRIENDLY IMMERSIVE READING MODE */

        body.reader-fullscreen {
            overflow: hidden;
            overscroll-behavior: none;
        }

        body.reader-fullscreen .reader {
            position: fixed;
            inset: 0;
            z-index: 90;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            min-height: 0;
            padding: 0;
            margin: 0;
            justify-content: center;
            background: #030407;
        }

        body.reader-fullscreen .page {
            width: 100%;
            height: 100%;
            min-height: 0;
            border: 0;
            background: #030407;
        }

        body.reader-fullscreen .comic-image {
            width: 100%;
            height: 100%;
            max-height: 100vh;
            max-height: 100dvh;
            object-fit: contain;
        }

        body.reader-fullscreen .page-navigation {
            display: none;
        }

        body.reader-fullscreen .reader-bar {
            height: 55px;
            padding: 0 12px;
            background: rgba(3, 4, 7, 0.6);
            border-bottom: 0;
        }

        body.reader-fullscreen .reader-logo {
            font-size: 14px;
            letter-spacing: 2px;
        }

        /* MOBILE LAYOUT */

        @media (max-width: 700px) {
            .reader-bar {
                height: 58px;
                padding: 0 12px;
            }

            .reader-logo {
                font-size: 15px;
                letter-spacing: 2px;
            }

            .reader-info {
                display: none;
            }

            .control {
                min-width: 36px;
                min-height: 36px;
                padding: 8px 10px;
            }

            .reader {
                padding: 75px 8px 35px;
            }

            .page {
                min-height: 200px;
            }

            .page-navigation {
                gap: 6px;
                margin-top: 15px;
            }

            .nav-button {
                padding: 12px 10px;
                font-size: 10px;
                letter-spacing: 1px;
            }

            .page-count {
                font-size: 10px;
                letter-spacing: 1px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <!-- HEADER -->

    <header class="reader-bar">
        <a href="archive.html" class="reader-logo">
            SENTINELS
        </a>

        <div class="reader-info" id="volumeTitle">
            VOLUME 1
        </div>

        <div class="reader-controls">
            <button
                class="control"
                id="fullscreenButton"
                type="button"
                onclick="toggleFullscreen()"
                aria-label="Enter fullscreen reading mode"
                title="Fullscreen"
            >
                ⛶
            </button>

            <button
                class="control"
                type="button"
                onclick="goArchive()"
                aria-label="Back to archive"
                title="Back to archive"
            >
                ☰
            </button>
        </div>
    </header>

    <!-- COMIC READER -->

    <main class="reader" id="reader">
        <div class="page" id="comicPage">
            <img
                id="comicImage"
                class="comic-image"
                alt="Sentinels comic page 1"
                hidden
            >

            <div class="message" id="volumeMessage" hidden>
                <div class="message-label">SENTINELS</div>
                <h1>COMING SOON</h1>
                <p>This volume is not available to read yet.</p>
            </div>

            <div class="error-message" id="errorMessage">
                <div class="message-label" id="errorPageLabel">
                    PAGE 01
                </div>
                <h2>PAGE NOT FOUND</h2>
                <p>
                    The reader could not load this page.
                    Please check the uploaded image filename
                    and folder path.
                </p>
            </div>
        </div>

        <!-- PAGE NAVIGATION -->

        <div class="page-navigation" id="pageNavigation">
            <button
                class="nav-button"
                id="previousButton"
                type="button"
                onclick="previousPage()"
            >
                ← PREVIOUS
            </button>

            <div class="page-count" id="pageCount">
                PAGE 1 / 25
            </div>

            <button
                class="nav-button"
                id="nextButton"
                type="button"
                onclick="nextPage()"
            >
                NEXT →
            </button>
        </div>
    </main>

    <script>
        /* READ VOLUME FROM URL */

        const params = new URLSearchParams(
            window.location.search
        );

        const volume = params.get("volume") || "1";

        /* VOLUME 1 SETTINGS */

        const totalPages = 25;
        const volumeFolder = "volume1";

        let currentPage = 1;
        let currentFileIndex = 0;

        const extensions = ["jpeg", "jpg", "png"];

        const volumeTitle = document.getElementById("volumeTitle");
        const comicImage = document.getElementById("comicImage");
        const volumeMessage = document.getElementById("volumeMessage");
        const errorMessage = document.getElementById("errorMessage");
        const errorPageLabel = document.getElementById("errorPageLabel");
        const pageCount = document.getElementById("pageCount");
        const previousButton = document.getElementById("previousButton");
        const nextButton = document.getElementById("nextButton");
        const fullscreenButton = document.getElementById("fullscreenButton");
        const comicPage = document.getElementById("comicPage");

        volumeTitle.textContent = "VOLUME " + volume;

        /* BUILD THE FILENAME OPTIONS FOR EACH PAGE */

        function getPossibleFilenames(pageNumber) {
            const number = String(pageNumber).padStart(2, "0");

            const names = [];

            for (const prefix of ["Page-", "page-", "Page", "page"]) {
                for (const extension of extensions) {
                    names.push(
                        prefix + number + "." + extension
                    );
                }
            }

            return names;
        }

        /* LOAD THE CURRENT PAGE */

        function updatePage() {
            const number = String(currentPage).padStart(2, "0");

            pageCount.textContent =
                "PAGE " + currentPage + " / " + totalPages;

            previousButton.disabled = currentPage === 1;
            nextButton.disabled = currentPage === totalPages;

            comicImage.hidden = true;
            errorMessage.style.display = "none";
            volumeMessage.hidden = true;

            if (volume !== "1") {
                volumeMessage.hidden = false;
                return;
            }

            comicImage.alt =
                "Sentinels comic page " + currentPage;

            currentFileIndex = 0;
            tryNextFilename(number);
        }

        /* TRY POSSIBLE IMAGE NAMES UNTIL ONE LOADS */

        function tryNextFilename(number) {
            const filenames = getPossibleFilenames(currentPage);

            if (currentFileIndex >= filenames.length) {
                comicImage.hidden = true;

                errorPageLabel.textContent =
                    "PAGE " + number;

                errorMessage.style.display = "block";
                return;
            }

            const filename = filenames[currentFileIndex];

            comicImage.src =
                volumeFolder + "/" + filename;
        }

        comicImage.onload = function () {
            comicImage.hidden = false;
            errorMessage.style.display = "none";
        };

        comicImage.onerror = function () {
            currentFileIndex++;

            tryNextFilename(
                String(currentPage).padStart(2, "0")
            );
        };

        /* NEXT AND PREVIOUS PAGE */

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                updatePage();

                if (!document.body.classList.contains("reader-fullscreen")) {
                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });
                }
            }
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                updatePage();

                if (!document.body.classList.contains("reader-fullscreen")) {
                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });
                }
            }
        }

        /* SWIPE LEFT/RIGHT IN IMMERSIVE MODE */

        let touchStartX = 0;
        let touchStartY = 0;

        comicPage.addEventListener("touchstart", function (event) {
            if (!document.body.classList.contains("reader-fullscreen")) {
                return;
            }

            if (event.touches.length !== 1) {
                touchStartX = 0;
                touchStartY = 0;
                return;
            }

            touchStartX = event.touches[0].clientX;
            touchStartY = event.touches[0].clientY;
        }, { passive: true });

        comicPage.addEventListener("touchend", function (event) {
            if (!document.body.classList.contains("reader-fullscreen")) {
                return;
            }

            if (touchStartX === 0 && touchStartY === 0) {
                return;
            }

            const touchEndX = event.changedTouches[0].clientX;
            const touchEndY = event.changedTouches[0].clientY;

            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;

            const minimumSwipeDistance = 50;
            const isHorizontalSwipe =
                Math.abs(deltaX) > minimumSwipeDistance &&
                Math.abs(deltaX) > Math.abs(deltaY) * 1.2;

            if (isHorizontalSwipe) {
                if (deltaX < 0) {
                    nextPage();
                } else {
                    previousPage();
                }
            }

            touchStartX = 0;
            touchStartY = 0;
        }, { passive: true });

        comicPage.addEventListener("touchcancel", function () {
            touchStartX = 0;
            touchStartY = 0;
        }, { passive: true });

        /* RETURN TO ARCHIVE */

        function goArchive() {
            window.location.href = "archive.html";
        }

        /* FULLSCREEN / IMMERSIVE MODE */

        function setReaderFullscreen(enabled) {
            document.body.classList.toggle(
                "reader-fullscreen",
                enabled
            );

            fullscreenButton.textContent =
                enabled ? "×" : "⛶";

            fullscreenButton.setAttribute(
                "aria-label",
                enabled
                    ? "Exit fullscreen reading mode"
                    : "Enter fullscreen reading mode"
            );

            fullscreenButton.setAttribute(
                "title",
                enabled ? "Exit fullscreen" : "Fullscreen"
            );
        }

        async function toggleFullscreen() {
            const currentlyImmersive =
                document.body.classList.contains(
                    "reader-fullscreen"
                );

            if (currentlyImmersive) {
                setReaderFullscreen(false);

                if (document.fullscreenElement) {
                    try {
                        await document.exitFullscreen();
                    } catch (error) {
                        /* CSS mode still exits if native exit is unavailable */
                    }
                }

                return;
            }

            /*
              Use native fullscreen where supported.
              iPhone Safari may not support fullscreen on the
              entire document, so CSS immersive mode is used too.
            */

            setReaderFullscreen(true);

            if (
                document.documentElement.requestFullscreen &&
                !document.fullscreenElement
            ) {
                try {
                    await document.documentElement.requestFullscreen();
                } catch (error) {
                    /* The phone-friendly CSS mode remains active */
                }
            }
        }

        /* KEEP BUTTON STATE IN SYNC IF NATIVE FULLSCREEN EXITS */

        document.addEventListener("fullscreenchange", function () {
            if (
                !document.fullscreenElement &&
                document.body.classList.contains(
                    "reader-fullscreen"
                )
            ) {
                setReaderFullscreen(false);
            }
        });

        /* KEYBOARD NAVIGATION ON DESKTOP */

        document.addEventListener("keydown", function (event) {
            if (event.key === "ArrowRight") {
                nextPage();
            }

            if (event.key === "ArrowLeft") {
                previousPage();
            }

            if (
                event.key === "Escape" &&
                document.body.classList.contains(
                    "reader-fullscreen"
                )
            ) {
                setReaderFullscreen(false);
            }
        });

        /* INITIAL PAGE */

        updatePage();
    </script>
</body>
</html>
