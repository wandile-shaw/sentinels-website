<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SENTINELS - Community Hub</title><link rel="stylesheet" href="style.css"></head>
<body data-page="hub"><main class="wrap">
<h2 class="sec" style="margin-top:50px">COMMUNITY HUB</h2>
<p class="sub">Ask questions, leave reviews and share your theories.</p>

<div class="panel" style="text-align:left">
 <div class="seg" id="types"><button type="button" class="on" data-t="question">QUESTION</button><button type="button" data-t="review">REVIEW</button><button type="button" data-t="theory">THEORY</button></div>
 <form id="cf" style="margin-top:20px;max-width:none">
  <label>NAME<input id="nm" maxlength="60" placeholder="Your name" autocomplete="name" required></label>
  <label id="vf" hidden>VOLUME<input id="vo" maxlength="50" placeholder="e.g. Volume 01"></label>
  <label><span id="ml">YOUR QUESTION</span><textarea id="ms" maxlength="2000" placeholder="Ask something about the Sentinels..." required></textarea></label>
  <p class="fb" id="fm" role="status" style="margin:0"></p>
  <div><button class="btn sm" id="sb" type="submit" style="margin:0">POST TO HUB</button></div>
 </form>
</div>

<h2 class="sec" style="margin-top:60px">COMMUNITY FEED</h2><p class="sub">What the readers are saying</p>
<div class="seg" id="filters" style="justify-content:center"><button type="button" class="on" data-f="all">ALL</button><button type="button" data-f="question">QUESTIONS</button><button type="button" data-f="review">REVIEWS</button><button type="button" data-f="theory">THEORIES</button></div>
<div class="feed" id="feed"><p class="sub">Connecting to the Hub...</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script>
/* Same Supabase project and tables as before: questions, reviews, theories */
const SUPABASE_URL="https://xoalbbgonrdcurcqnhrg.supabase.co",SUPABASE_KEY="sb_publishable_oVi0PtSGcSOJQcKDRDOgTQ_LRqu3jLb"; /* public (publishable) key - never put a secret/service_role key here */
const $=id=>document.getElementById(id);
let db=null,type="question",filter="all",posts=[];
const TABLE={question:["questions","question"],review:["reviews","review"],theory:["theories","theory"]};
const TEXT={question:["YOUR QUESTION","Ask something about the Sentinels..."],review:["YOUR REVIEW","Tell us what you thought about the volume..."],theory:["YOUR THEORY","What do you think happens next?"]};
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const norm=(t,r)=>({type:t,name:r.name,content:r[TABLE[t][1]],volume:t==="review"?r.volume:"",at:r.created_at});
const when=d=>{const x=new Date(d);return isNaN(x)?"":x.toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"})};
const say=(m,k)=>{$("fm").textContent=m;$("fm").style.color=k==="ok"?"#42e38b":k==="err"?"#ff4d55":""};

function render(){
 const list=filter==="all"?posts:posts.filter(p=>p.type===filter);
 $("feed").innerHTML=list.length?list.map(p=>`<article class="post ${p.type}"><div class="post-top"><b>${p.type.toUpperCase()}</b><span>${esc(when(p.at))}</span></div>
  <h3>${esc(p.name)}</h3>${p.volume?`<div class="vol-t">${esc(p.volume)}</div>`:""}<p class="c">${esc(p.content)}</p></article>`).join("")
  :'<p class="sub">Nothing has been posted here yet.</p>';
}
async function load(){
 $("feed").innerHTML='<p class="sub">Connecting to the Hub...</p>';
 try{
  const keys=Object.keys(TABLE);
  const res=await Promise.all(keys.map(k=>db.from(TABLE[k][0]).select("*").order("created_at",{ascending:false})));
  posts=[];
  res.forEach((r,i)=>{if(r.error)throw new Error(TABLE[keys[i]][0]+": "+r.error.message);posts.push(...(r.data||[]).map(x=>norm(keys[i],x)))});
  posts.sort((a,b)=>new Date(b.at)-new Date(a.at));render();
 }catch(e){console.error(e);$("feed").innerHTML='<p class="sub" style="color:#ff4d55">The Hub could not connect to the database. '+esc(e.message)+'</p>'}
}
document.querySelectorAll("#types button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("#types button").forEach(x=>x.classList.remove("on"));b.classList.add("on");type=b.dataset.t;
 $("vf").hidden=type!=="review";$("ml").textContent=TEXT[type][0];$("ms").placeholder=TEXT[type][1]});
document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("on"));b.classList.add("on");filter=b.dataset.f;render()});
$("cf").onsubmit=async e=>{
 e.preventDefault();say("");
 const name=$("nm").value.trim(),msg=$("ms").value.trim(),vol=$("vo").value.trim();
 if(!name||!msg)return say("Please fill in your name and message.","err");
 if(type==="review"&&!vol)return say("Please enter the volume you are reviewing.","err");
 if(!db)return say("The Hub is not connected yet. Refresh the page and try again.","err");
 $("sb").disabled=true;$("sb").textContent="POSTING...";
 try{
  const row={name};if(type==="review")row.volume=vol;row[TABLE[type][1]]=msg;
  const r=await db.from(TABLE[type][0]).insert(row).select().single();
  if(r.error)throw new Error(r.error.message);
  posts.unshift(norm(type,r.data));render();$("cf").reset();say("Your post has been added to the Hub.","ok");setTimeout(()=>say(""),5000);
 }catch(x){console.error(x);say("Your post could not be submitted: "+x.message,"err")}
 finally{$("sb").disabled=false;$("sb").textContent="POST TO HUB"}
};
if(!window.supabase||!window.supabase.createClient){$("feed").innerHTML='<p class="sub" style="color:#ff4d55">The Supabase library could not be loaded. Check your internet connection and refresh.</p>'}
else{db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);load()}
</script></body></html>
